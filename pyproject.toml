[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["import_wls", "src"]

# Preserve the formatting of the covariance module already merged by the team.
# Its tests and all other lint rules remain enabled.
[tool.ruff.lint.per-file-ignores]
"src/covariance.py" = ["I001"]

[tool.ruff.format]
exclude = ["src/covariance.py"]
